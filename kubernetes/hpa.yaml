apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: github-trending-hpa
  namespace: galaxy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: github-trending
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
