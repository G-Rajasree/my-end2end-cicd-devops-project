server.port=8000

# App info — BUILD_NUMBER is injected by Jenkins at build time via maven -Dapp.build.number=
app.version=2.1.2
app.build.number=${BUILD_NUMBER:local}

# Actuator endpoints for Kubernetes probes and Prometheus scraping
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Info endpoint metadata
info.app.name=galaxy-devops
info.app.version=${app.version}
info.app.description=GitHub Trending Repositories - Galaxy DevOps Project
